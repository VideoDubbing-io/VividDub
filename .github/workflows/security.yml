name: Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-safety-check:
    name: Public safety check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for private key blocks
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E '-----BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----'; then
            echo "Private key material must not be committed."
            exit 1
          fi

      - name: Check for environment files
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f -name ".env" -print -quit | grep -q .; then
            echo "Environment files must not be committed."
            exit 1
          fi
